<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inscription — Ymmo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="auth-page">

    <div class="auth-page__visual">
      <div class="auth-visual__logo">
        <a href="index.html" class="logo logo--light">
          <span class="logo__mark">Y</span>
          <span class="logo__text">mmo</span>
        </a>
      </div>
      <h2 class="auth-visual__title">Rejoignez<br />le réseau Ymmo.</h2>
      <p class="auth-visual__subtitle">Créez votre compte agent pour accéder à votre espace de gestion et publier vos biens.</p>
    </div>

    <div class="auth-page__form-area">
      <div class="auth-form" style="max-width:440px">
        <div class="auth-form-header">
          <h2>Créer un compte</h2>
          <p>Remplissez les informations ci-dessous pour rejoindre Ymmo.</p>
        </div>

        <div class="alert alert--error" id="regError"></div>
        <div class="alert alert--success" id="regSuccess"></div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
          <div class="form-group">
            <label for="regFirst">Prénom</label>
            <input type="text" id="regFirst" placeholder="Jean" />
          </div>
          <div class="form-group">
            <label for="regLast">Nom</label>
            <input type="text" id="regLast" placeholder="Dupont" />
          </div>
        </div>
        <div class="form-group">
          <label for="regEmail">Email</label>
          <input type="email" id="regEmail" placeholder="jean@ymmo.fr" />
        </div>
        <div class="form-group">
          <label for="regPassword">Mot de passe</label>
          <input type="password" id="regPassword" placeholder="Minimum 8 caractères" />
        </div>
        <div class="form-group">
          <label for="regAgency">Agence (optionnel)</label>
          <select id="regAgency">
            <option value="">Sélectionner une agence…</option>
          </select>
        </div>

        <button class="btn btn--primary btn--full btn--lg" id="regSubmit" onclick="handleRegister()">
          Créer mon compte
        </button>

        <div class="auth-form-footer">
          Déjà un compte ? <a href="login.html">Se connecter</a>
        </div>
      </div>
    </div>
  </div>

  <script src="api.js"></script>
  <script src="components.js"></script>
  <script>
    if (Auth.isLoggedIn()) window.location.href = 'dashboard.html';

    // Charger les agences dans le select
    async function loadAgencies() {
      try {
        const agencies = await AgenciesAPI.getAll();
        const sel = document.getElementById('regAgency');
        agencies.forEach(a => {
          const opt = document.createElement('option');
          opt.value = a.id;
          opt.textContent = `${a.name} — ${a.city}`;
          sel.appendChild(opt);
        });
      } catch (e) { /* silencieux */ }
    }
    loadAgencies();

    async function handleRegister() {
      const first_name = document.getElementById('regFirst').value.trim();
      const last_name = document.getElementById('regLast').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;
      const agency_id = document.getElementById('regAgency').value || null;
      const errEl = document.getElementById('regError');
      const succEl = document.getElementById('regSuccess');
      const btn = document.getElementById('regSubmit');

      errEl.classList.remove('show');
      succEl.classList.remove('show');

      if (!first_name || !last_name || !email || !password) {
        errEl.textContent = 'Veuillez remplir tous les champs obligatoires.';
        errEl.classList.add('show');
        return;
      }
      if (password.length < 8) {
        errEl.textContent = 'Le mot de passe doit contenir au moins 8 caractères.';
        errEl.classList.add('show');
        return;
      }

      btn.textContent = 'Création…';
      btn.disabled = true;

      try {
        await AuthAPI.register({ first_name, last_name, email, password, agency_id, role: 'agent' });
        succEl.textContent = 'Compte créé ! Redirection vers la connexion…';
        succEl.classList.add('show');
        setTimeout(() => window.location.href = 'login.html', 1200);
      } catch (err) {
        errEl.textContent = err.message || 'Erreur lors de la création du compte.';
        errEl.classList.add('show');
        btn.textContent = 'Créer mon compte';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
