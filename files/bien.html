<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fiche bien — Ymmo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="header" id="header">
    <div class="header__inner container">
      <a href="index.html" class="logo">
        <span class="logo__mark">Y</span>
        <span class="logo__text">mmo</span>
      </a>
      <nav class="nav">
        <a href="index.html" class="nav__link">Accueil</a>
        <a href="catalogue.html" class="nav__link nav__link--active">Biens</a>
        <a href="agences.html" class="nav__link">Agences</a>
        <a href="index.html#contact" class="nav__link">Contact</a>
      </nav>
      <div class="header__actions">
        <a href="login.html" class="btn btn--ghost" id="loginBtn">Connexion</a>
        <a href="dashboard.html" class="btn btn--primary hidden" id="dashboardBtn">Mon espace</a>
      </div>
      <button class="burger" id="burger" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
    </div>
    <div class="nav-mobile" id="navMobile">
      <a href="index.html" class="nav__link">Accueil</a>
      <a href="catalogue.html" class="nav__link">Catalogue</a>
      <a href="agences.html" class="nav__link">Agences</a>
      <a href="login.html" class="btn btn--primary">Connexion</a>
    </div>
  </header>

  <div class="property-detail" id="propertyDetail">
    <!-- Chargement -->
    <div style="display:flex;align-items:center;justify-content:center;height:60vh">
      <p style="color:var(--gray-400)">Chargement du bien…</p>
    </div>
  </div>

  <footer class="footer">
    <div class="container footer__inner">
      <div class="footer__brand">
        <a href="index.html" class="logo logo--light">
          <span class="logo__mark">Y</span><span class="logo__text">mmo</span>
        </a>
        <p>Votre partenaire immobilier en France depuis 2004.</p>
      </div>
      <div class="footer__links">
        <div class="footer__col">
          <h4>Navigation</h4>
          <a href="index.html">Accueil</a>
          <a href="catalogue.html">Catalogue</a>
        </div>
      </div>
    </div>
    <div class="footer__bottom container">
      <span>© 2025 Ymmo Groupe Immobilier · Tous droits réservés</span>
    </div>
  </footer>

  <script src="api.js"></script>
  <script src="components.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      const container = document.getElementById('propertyDetail');

      if (!id) {
        container.innerHTML = `<div style="text-align:center;padding:80px"><p>Bien non trouvé.</p><a href="catalogue.html" class="btn btn--primary" style="margin-top:16px;display:inline-flex">Retour au catalogue</a></div>`;
        return;
      }

      try {
        const properties = await PropertiesAPI.getAll();
        const p = properties.find(x => x.id == id);
        if (!p) throw new Error('Not found');

        document.title = `${p.title} — Ymmo`;
        const typeIcon = p.property_type === 'house'
          ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z"/><path d="M9 21V12h6v9"/></svg>`
          : (p.property_type === 'apartment'
            ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><rect x="2" y="7" width="20" height="14" rx="1"/><path d="M16 7V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v2"/></svg>`
            : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><rect x="3" y="3" width="18" height="18" rx="1"/><path d="M9 3v18M3 9h6M3 15h6"/></svg>`);

        container.innerHTML = `
          <div class="property-detail__hero">
            <div style="width:140px;height:140px;opacity:0.12;color:#1A2744">${typeIcon}</div>
            <span class="property-card__badge ${p.transaction_type === 'sale' ? 'badge--sale' : 'badge--rent'}" style="position:absolute;top:20px;left:24px;font-size:0.82rem">
              ${formatTransaction(p.transaction_type)}
            </span>
          </div>

          <div class="property-detail__body">
            <div class="property-detail__main">
              <a href="catalogue.html" style="display:inline-flex;align-items:center;gap:6px;font-size:0.85rem;color:var(--gray-600);margin-bottom:20px;transition:color 0.2s">
                ← Retour au catalogue
              </a>
              <div class="property-detail__eyebrow">${formatType(p.property_type)}</div>
              <h1 class="property-detail__title">${p.title}</h1>
              <div class="property-detail__city">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
                ${p.city}
              </div>
              <div class="property-detail__specs">
                <div class="spec-item">
                  <span class="spec-item__label">Surface</span>
                  <span class="spec-item__value">${p.surface_area} m²</span>
                </div>
                ${p.rooms > 0 ? `<div class="spec-item"><span class="spec-item__label">Pièces</span><span class="spec-item__value">${p.rooms}</span></div>` : ''}
                ${p.bedrooms > 0 ? `<div class="spec-item"><span class="spec-item__label">Chambres</span><span class="spec-item__value">${p.bedrooms}</span></div>` : ''}
                <div class="spec-item">
                  <span class="spec-item__label">Statut</span>
                  <span class="spec-item__value">${formatStatus(p.status).label}</span>
                </div>
              </div>
              <p class="property-detail__desc">
                ${p.description || 'Aucune description disponible pour ce bien. Contactez notre agence pour plus d\'informations.'}
              </p>
            </div>

            <aside class="property-detail__sidebar">
              <div class="contact-box">
                <div class="contact-box__header">
                  <div class="contact-box__price">${formatPrice(p.price, p.transaction_type)}</div>
                  <div class="contact-box__type">${formatTransaction(p.transaction_type)}</div>
                </div>
                <div class="contact-box__body">
                  <p style="font-size:0.88rem;color:var(--gray-600);margin-bottom:18px">Intéressé par ce bien ? Laissez vos coordonnées, un agent vous contacte sous 24h.</p>
                  <div class="form-group"><label>Nom complet</label><input type="text" id="cboxName" placeholder="Jean Dupont" /></div>
                  <div class="form-group"><label>Email</label><input type="email" id="cboxEmail" placeholder="jean@example.com" /></div>
                  <div class="form-group"><label>Téléphone</label><input type="tel" id="cboxPhone" placeholder="+33 6 XX XX XX XX" /></div>
                  <div class="form-group"><label>Message</label><textarea id="cboxMessage" rows="3" placeholder="Votre message…">Bonjour, je suis intéressé par le bien "${p.title}". Pouvez-vous me recontacter ?</textarea></div>
                  <button class="btn btn--gold btn--full" onclick="submitPropertyContact(${p.id})">Envoyer ma demande</button>
                  <p class="form-notice" id="cboxNotice" style="text-align:center;font-size:0.82rem;margin-top:10px"></p>
                </div>
              </div>
            </aside>
          </div>
        `;
      } catch (err) {
        container.innerHTML = `<div style="text-align:center;padding:80px">
          <p>Bien introuvable ou serveur indisponible.</p>
          <a href="catalogue.html" class="btn btn--primary" style="margin-top:16px;display:inline-flex">Retour au catalogue</a>
        </div>`;
      }
    });

async function submitPropertyContact(propertyId) {
    const name = document.getElementById('cboxName')?.value?.trim();
    const email = document.getElementById('cboxEmail')?.value?.trim();
    const phone = document.getElementById('cboxPhone')?.value?.trim();
    const message = document.getElementById('cboxMessage')?.value?.trim();
    const notice = document.getElementById('cboxNotice');

    if (!name || !email || !message) {
        if (notice) { notice.textContent = 'Veuillez remplir les champs obligatoires.'; notice.style.color = 'var(--error)'; }
        return;
    }

    try {
        await apiRequest('POST', '/contact_requests', {
            property_id: propertyId,
            full_name: name,
            email: email,
            phone: phone,
            message: message
        });
        if (notice) {
            notice.textContent = '✓ Demande envoyée ! Un agent vous contacte sous 24h.';
            notice.style.color = 'var(--success)';
        }
    } catch (err) {
        if (notice) {
            notice.textContent = 'Erreur lors de l\'envoi. Réessayez.';
            notice.style.color = 'var(--error)';
        }
    }
}
  </script>
</body>
</html>
